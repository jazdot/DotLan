name: Build DotLan Test APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.x'
          channel: 'stable'
          cache: true

      - name: Configure Android SDK and Flutter paths
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          echo "flutter.sdk=$FLUTTER_ROOT" >> android/local.properties

      - name: Get Flutter Dependencies
        run: flutter pub get

      - name: Run Subnet Conformance Test Suite
        run: python3 -m unittest discover -s tests -p "test_*.py" -v

      - name: Analyze Dart Codebase
        run: |
          set +e
          flutter analyze --no-fatal-infos --no-fatal-warnings > analyze_log.txt 2>&1
          ANALYSIS_STATUS=$?
          if [ $ANALYSIS_STATUS -ne 0 ]; then
            python3 -c '
          try:
              with open("analyze_log.txt") as f:
                  lines = f.readlines()
              summary = "".join(lines[-60:])
              encoded = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Flutter Analyze Failure::{encoded}")
          except Exception as e:
              print(f"::error title=Flutter Analyze Failure::{e}")
          '
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-logs
            git reset
            git add analyze_log.txt
            git commit -m "Analyze failure log"
            git push -f origin ci-logs || true
            exit $ANALYSIS_STATUS
          fi

      - name: Build Android Release APK
        run: |
          set +e
          flutter build apk --release --verbose > build_log.txt 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            python3 -c '
          try:
              with open("build_log.txt") as f:
                  lines = f.readlines()
              filtered = [l for l in lines if not any(x in l for x in ["\tat org.gradle.", "\tat java.", "\tat com.google.common."])]
              summary = "".join(filtered[-70:])
              encoded = summary.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")
              print(f"::error title=Build Failure::{encoded}")
          except Exception as e:
              print(f"::error title=Build Failure::{e}")
          '
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git checkout --orphan ci-logs
            git reset
            git add build_log.txt
            git commit -m "CI build log"
            git push -f origin ci-logs || true
            exit $BUILD_STATUS
          fi
          echo "### ✅ Android Release APK Build Succeeded" >> $GITHUB_STEP_SUMMARY

      - name: Prepare Named Release APK
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/DotLan-v1.0.0-preview.apk

      - name: Upload Test APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DotLan-Release-APK
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

      - name: Publish Test Release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0-preview
          name: "DotLan v1.0.0 (Field Test Build)"
          body: |
            ### DotLan Local Subnet & Camera Radar Test Build
            - Architecture: Universal APK (armeabi-v7a, arm64-v8a, x86_64)
            - 100% Ad-Free, Zero-Cloud, Zero-Login Local Subnet Discovery
            - Verified RTSP/ONVIF Hidden Camera Sentry
            - Part of the Jazdot Enterprises Mobile Network Suite
          files: build/app/outputs/flutter-apk/*.apk
          draft: false
          prerelease: true

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Build-Logs
          path: build_log.txt
          if-no-files-found: ignore
